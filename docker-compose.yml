services:
  backend:
    build:
      context: ./suraksha-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MONGO_URI: ${MONGO_URI:?set MONGO_URI}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SURAKSHA_OFFICER_ID: ${SURAKSHA_OFFICER_ID:?set SURAKSHA_OFFICER_ID}
      SURAKSHA_OFFICER_PASSWORD: ${SURAKSHA_OFFICER_PASSWORD:?set SURAKSHA_OFFICER_PASSWORD}
      SURAKSHA_OFFICER_NAME: ${SURAKSHA_OFFICER_NAME:-Control Room Officer}
      SURAKSHA_OFFICER_ROLE: ${SURAKSHA_OFFICER_ROLE:-control-room}
      PINATA_JWT: ${PINATA_JWT:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
